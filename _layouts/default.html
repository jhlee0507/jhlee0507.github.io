<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} — {{ site.title | escape }}{% else %}{{ site.title | escape }} — {{ site.tagline | escape }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#eeeef2">
<script>
/* Marks that scripts run, so the header shows the three-line menu from the first paint. On the main page it also
   forwards the old single-page links (#about, #research, #cve) to their new pages. It sits above the stylesheets
   so that the forward does not wait for them. */
(function(d){d.className+=' js';{% if page.key == 'home' %}function go(){var to={'#about':'about/','#research':'projects/','#cve':'cve/'}[location.hash];if(to)location.replace('{{ '/' | relative_url }}'+to)}go();addEventListener('hashchange',go);{% endif %}})(document.documentElement);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..800&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="page-{{ page.key | default: 'page' }}{% if page.key == 'home' and site.intro.size > 0 %} has-intro{% endif %}">
<a class="skip" href="#main">Skip to content</a>

{% if page.key == 'home' %}{% include art.html %}{% endif %}
{% include header.html %}
<main id="main" class="wrap">
{% if page.key == 'home' %}{% include hero.html %}{% endif %}
{{ content }}
</main>

<footer class="wrap"></footer>
<div class="page-art page-art--end" aria-hidden="true"><div class="blob"></div></div>
<!-- If the menu script cannot be loaded, fall back to the plain header with its links visible. -->
<script src="{{ '/assets/js/site.js' | relative_url }}" defer onerror="document.documentElement.classList.remove('js')"></script>
</body>
</html>
