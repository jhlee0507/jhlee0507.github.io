<header class="wrap mast" id="top">
  <a class="handle" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}, home">{{ site.title | escape }}</a>
  <div class="tools">
  <button class="theme-btn" type="button" aria-label="Switch to dark mode">
    <svg class="moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <nav aria-label="Site">
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <div class="links" id="site-nav">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.key == item.key %} aria-current="page"{% endif %}><span class="n" aria-hidden="true">/</span>{{ item.label | escape }}</a>
      {%- endfor %}
    </div>
  </nav>
  </div>
</header>
