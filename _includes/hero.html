<section class="hero" aria-labelledby="name">
  <h1 id="name" aria-label="{{ site.title | escape }}"><span class="wm">r3c<span class="zero">0</span>n</span></h1>
  <p class="lede">{% include t.html en=site.tagline ko=site.tagline_ko %}</p>
  {%- if site.intro.size > 0 %}
  <div class="intro">
    {%- for line in site.intro %}
    {%- assign line_ko = site.intro_ko[forloop.index0] %}
    <p>{% include t.html en=line ko=line_ko %}</p>
    {%- endfor %}
  </div>
  {%- endif %}
  <div class="meta">
    <a class="btn" href="{{ '/activities/' | relative_url }}">
      {% include t.html en="Activities" ko="활동" %}
      <svg class="go" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </a>
  </div>
</section>
