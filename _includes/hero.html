<section class="hero" aria-labelledby="name">
  <h1 id="name" aria-label="{{ site.title | escape }}"><span class="wm">r3con</span></h1>
  <p class="lede">{% include t.html en=site.tagline ko=site.tagline_ko %}</p>
  {%- if site.intro.size > 0 %}
  <div class="intro">
    {%- for line in site.intro %}
    {%- assign line_ko = site.intro_ko[forloop.index0] %}
    <p>{% include t.html en=line ko=line_ko %}</p>
    {%- endfor %}
  </div>
  {%- endif %}
</section>
