# The three-line menu, in order. Each item is shown as a path (/whoami).
# `key` is the `key:` at the top of the page's index.html (and the id of its section); `url` is its folder.
# Old single-page links (/#about, /#research, /#cve) and the earlier /about/ address (about/index.html)
# are forwarded: the first by the script in _layouts/default.html, the second by that small page;
# if a folder or key here is renamed, change it there too.
- key: whoami
  label: whoami
  url: /whoami/
- key: projects
  label: Project
  url: /projects/
- key: cve
  label: CVE
  url: /cve/
